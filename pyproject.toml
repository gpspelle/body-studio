[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "body-studio"
dynamic = ["version"]
description = "Turn a phone video of a person into a 3D body you can orbit, on your own Mac. Built on splat-studio."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# The capture pipeline (ffmpeg -> COLMAP -> Brush, fog and background removal, Spark viewer
# files) comes from splat-studio, pinned to one commit. Bump the pin on purpose, never float it.
dependencies = [
    "splat-studio @ git+https://github.com/gpspelle/splat-studio@0d3148676f742e768888035ded8f8ca76499b9c6",
    # splat-studio drops blurry frames with OpenCV when it's there; install it with the app so a
    # capture never runs without it (and setup never has to install it afterwards)
    "opencv-python-headless",
]

[project.optional-dependencies]
# Trial only (`body-studio fit-anny`): fits the clothes' base mesh with Anny, a PyTorch body model
# (Apache-2.0 code, CC0 MakeHuman data). The app itself stays standard library.
anny = ["anny>=0.6", "torch>=2.0"]
# Decor from a photo (photo3d.py, TripoSR): what it needs besides TripoSR's own code, which isn't on
# PyPI (the app downloads it at a pinned commit). The app installs these itself the first time.
photo3d = ["torch>=2.0", "transformers>=4.35,<5", "omegaconf>=2.3", "einops", "trimesh>=4",
           "rembg>=2.0.50", "onnxruntime", "huggingface-hub", "PyMCubes", "Pillow", "imageio", "numpy"]

[project.scripts]
body-studio = "body_studio.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "body_studio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
body_studio = ["static/*.html", "static/*.css", "static/*.js", "static/decor/*.js", "static/wardrobe/*", "static/flash/*.svg", "wardrobe/*.gz",
               "wardrobe/items/*.gz"]
