<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Studio</title>
<link rel="stylesheet" href="/static/body.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='3.5' r='2.5' fill='%23888'/%3E%3Crect x='5' y='7' width='6' height='8' rx='3' fill='%23888'/%3E%3C/svg%3E">
<script src="/static/i18n.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.min.js",
    "three/addons/": "/vendor/three/addons/",
    "@sparkjsdev/spark": "/vendor/spark/spark.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="stage" data-i18n-aria-label="app.view"></canvas>

<header class="bar">
  <!-- the name opens the menu of what to do (modes.js); what a mode needs at the edges shows in it -->
  <button id="menuBtn" class="mark" aria-haspopup="dialog" aria-controls="modes" aria-expanded="false">
    <span>Body Studio</span><span id="modeName" class="mode-name"></span>
  </button>
  <span id="job" class="pill" role="status" hidden></span>
  <span class="grow"></span>
  <button id="roomBtn" class="btn in-rooms" aria-controls="roomMenu" aria-expanded="false" data-i18n="room.btn"></button>
  <button id="decorBtn" class="btn in-rooms" aria-controls="decor" aria-expanded="false" data-i18n="decor.btn" hidden></button>
  <!-- (opened by the menu; the panels' code still listens to them) -->
  <div hidden>
    <button id="studioBtn" aria-controls="studio" aria-expanded="false" hidden></button>
    <button id="progressBtn" aria-controls="progress" aria-expanded="false"></button>
  </div>
  <input id="pick" type="file" accept=".mov,.mp4,.m4v,video/*" hidden>
</header>
<dialog id="modes" class="modes" data-i18n-aria-label="modes.title">
  <nav>
    <button data-mode="clothes"><strong data-i18n="modes.clothes"></strong><span data-i18n="modes.clothesHow"></span></button>
    <button data-mode="tattoos"><strong data-i18n="modes.tattoos"></strong><span data-i18n="modes.tattoosHow"></span></button>
    <button data-mode="rooms"><strong data-i18n="modes.rooms"></strong><span data-i18n="modes.roomsHow"></span></button>
    <button data-mode="progress"><strong data-i18n="modes.progress"></strong><span data-i18n="modes.progressHow"></span></button>
    <label for="pick" id="newBody" tabindex="0"><strong data-i18n="app.new"></strong><span data-i18n="modes.newHow"></span></label>
    <button id="guideBtn" aria-haspopup="dialog" aria-controls="guide"><strong data-i18n="guide.open"></strong><span data-i18n="modes.guideHow"></span></button>
  </nav>
</dialog>

<div id="empty" class="center" hidden>
  <p class="big" data-i18n="empty.title"></p>
  <p class="quiet" data-i18n="empty.how"></p>
</div>
<div id="loading" class="center" hidden><p class="quiet" id="loadingText"></p></div>
<div id="busy" class="loader" role="status" aria-live="polite">
  <div class="busy-logo" aria-hidden="true">
    <svg class="busy-figure" viewBox="4.5 0.5 7 15"><circle cx="8" cy="3.5" r="2.5"/><rect x="5" y="7" width="6" height="8" rx="3"/></svg>
    <span class="busy-floor"></span>
  </div>
  <p class="busy-name">Body Studio</p>
  <p id="busyText" class="quiet"></p>
  <p id="busySlow" class="small"></p>
</div>

<div class="bottom">
  <p id="walkHint" class="walk-hint" role="status" hidden></p>
  <!-- in a room: how it is seen (house.js) -->
  <div id="roomViews" class="chips views in-rooms" role="group" data-i18n-aria-label="room.views" hidden>
    <button type="button" id="bodyBtn" data-view="body" class="on" aria-pressed="true" data-i18n="room.third"></button>
    <button type="button" id="eyeBtn" data-view="eyes" aria-pressed="false" data-i18n="room.eye"></button>
    <button type="button" id="skyBtn" data-view="above" aria-pressed="false" data-i18n="room.sky"></button>
    <button type="button" id="flyBtn" data-view="fly" aria-pressed="false" data-i18n="room.fly"></button>
  </div>
  <div id="studioViews" class="chips views" role="group" data-i18n-aria-label="studio.views" hidden>
    <button type="button" data-view="room" class="on" data-i18n="studio.viewRoom"></button>
    <button type="button" data-view="artist" data-i18n="studio.viewArtist"></button>
    <button type="button" data-view="mirror" data-i18n="studio.viewMirror"></button>
  </div>
  <nav id="shelf" class="shelf" data-i18n-aria-label="app.bodies"></nav>
  <footer class="foot">
    <span id="version"></span> ·
    <a href="https://github.com/gpspelle/body-studio" target="_blank" rel="noopener" data-i18n="foot.source"></a> ·
    <a href="https://github.com/gpspelle/body-studio/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="foot.license"></a> ·
    <a href="https://github.com/gpspelle/body-studio/blob/main/CREDITS.md" target="_blank" rel="noopener" data-i18n="foot.credits"></a>
  </footer>
</div>
<aside id="progress" class="panel" data-i18n-aria-label="prog.open" hidden>
  <div class="panel-head">
    <select id="who" data-i18n-aria-label="prog.person"></select>
    <button id="closeProgress" class="link close" data-i18n-aria-label="prog.close">✕</button>
  </div>
  <form id="personForm" class="form" hidden>
    <p class="quiet" data-i18n="prog.intro"></p>
    <label><span data-i18n="prog.name"></span><input name="name" required autocomplete="off"></label>
    <label><span data-i18n="prog.sex"></span><select name="sex"><option value="f" data-i18n="prog.female"></option><option value="m" data-i18n="prog.male"></option></select></label>
    <label><span data-i18n="prog.height"></span><input name="height_cm" type="number" inputmode="decimal" step="0.1" min="80" max="250" required></label>
    <button class="btn primary" data-i18n="prog.save"></button>
    <p class="err" role="alert"></p>
  </form>
  <div id="personView" hidden>
    <section class="fat">
      <h2 data-i18n="prog.bodyFat"></h2>
      <div id="fatNow"></div>
      <svg id="fatChart" class="chart" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true"></svg>
      <p id="fatNote" class="small"></p>
    </section>
    <section>
      <h2 data-i18n="prog.tape"></h2>
      <div id="tapeRows" class="rows"></div>
    </section>
    <section>
      <h2 data-i18n="prog.scans"></h2>
      <div id="scanList" class="chips"></div>
      <p id="noScans" class="small" data-i18n="prog.noScans"></p>
      <button id="addScan" class="btn" data-i18n="prog.addScan"></button>
      <p id="scanErr" class="err" role="alert"></p>
      <div id="scanRows" class="rows"></div>
      <figure id="profile" hidden>
        <figcaption class="small" data-i18n="prog.profile"></figcaption>
        <svg id="profileChart" class="chart" viewBox="0 0 300 200" aria-hidden="true"></svg>
      </figure>
    </section>
    <section>
      <form id="tapeForm" class="form tape">
        <label><span data-i18n="prog.date"></span><input name="date" type="date" required></label>
        <label><span data-i18n="prog.weight"></span><input name="weight_kg" type="number" inputmode="decimal" step="0.1" placeholder="kg"></label>
        <label><span data-i18n="prog.waist"></span><input name="waist_cm" type="number" inputmode="decimal" step="0.1" placeholder="cm"></label>
        <label><span data-i18n="prog.neck"></span><input name="neck_cm" type="number" inputmode="decimal" step="0.1" placeholder="cm"></label>
        <label><span data-i18n="prog.hips"></span><input name="hip_cm" type="number" inputmode="decimal" step="0.1" placeholder="cm"></label>
        <button class="btn primary" data-i18n="prog.add"></button>
        <p class="err" role="alert"></p>
      </form>
      <details id="entries"><summary></summary><ul></ul></details>
    </section>
  </div>
</aside>
<aside id="studio" class="panel left" data-i18n-aria-label="studio.open" hidden>
  <div class="panel-head">
    <strong data-i18n="studio.open"></strong>
    <span class="grow"></span>
    <button id="closeStudio" class="link close" data-i18n-aria-label="studio.close">✕</button>
  </div>
  <p id="studioStatus" class="small" role="status"></p>
  <div id="studioBody" hidden>
    <section id="wear">
      <h2 data-i18n="wear.title"></h2>
      <p id="wearHint" class="small"></p>
      <div class="chips" id="wearModel" role="group" data-i18n-aria-label="wear.model" hidden>
        <span class="small" data-i18n="wear.model"></span>
        <button data-model="standard" data-i18n="wear.model.standard"></button>
        <button data-model="anny" data-i18n="wear.model.anny"></button>
      </div>
      <div class="chips" id="wearWorn"></div>
      <button id="wearNone" class="link" data-i18n="wear.takeAll" hidden></button>
      <p id="wearStatus" class="small" role="status"></p>
      <div class="chips" id="wearStyles" role="group" data-i18n-aria-label="wear.styles"></div>
      <div id="wearPick"></div>
    </section>
    <section>
      <h2 data-i18n="tat.title"></h2>
      <div class="chips" id="tatList"></div>
      <label class="btn" for="tatPick" data-i18n="tat.add"></label>
      <input id="tatPick" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden>
      <p id="tatHint" class="small"></p>
      <div id="tatEdit" class="sliders" hidden>
        <label><span data-i18n="tat.label"></span><input id="tatName" type="text" maxlength="40" autocomplete="off"></label>
        <label><span data-i18n="tat.size"></span><input id="tatSize" type="range" min="1" max="60" step="0.5"><output id="tatSizeOut"></output></label>
        <label><span data-i18n="tat.angle"></span><input id="tatAngle" type="range" min="-180" max="180" step="1"><output id="tatAngleOut"></output></label>
        <label><span data-i18n="tat.ink"></span><input id="tatInk" type="range" min="0.2" max="1" step="0.05"><output id="tatInkOut"></output></label>
        <button id="tatRemove" class="link danger" data-i18n="tat.remove"></button>
      </div>
      <label class="inline small"><span data-i18n="tat.height"></span><input id="tatHeight" type="number" inputmode="decimal" min="80" max="250" step="0.5"></label>
    </section>
    <section>
      <h2 data-i18n="pose.title"></h2>
      <p class="small" data-i18n="pose.hint"></p>
      <div class="chips" id="presets"></div>
      <div class="inline-chips"><span class="small" data-i18n="pose.hands"></span><div class="chips" id="handsPick"></div></div>
      <div id="whatIf" class="sliders" hidden>
        <div class="joint-head"><span class="small" data-i18n="pose.whatIf"></span><button id="wiReset" class="link" data-i18n="pose.whatIfReset"></button></div>
        <label><span data-i18n="pose.heavier"></span><input id="wiWeight" type="range" min="-1" max="1" step="0.05" value="0"><output id="wiWeightOut"></output></label>
        <label><span data-i18n="pose.muscle"></span><input id="wiMuscle" type="range" min="-1" max="1" step="0.05" value="0"><output id="wiMuscleOut"></output></label>
      </div>
      <div id="jointEdit" class="sliders" hidden>
        <div class="joint-head"><strong id="jointName"></strong><button id="jointReset" class="link" data-i18n="pose.resetJoint"></button></div>
        <div id="jointSliders"></div>
      </div>
      <button id="poseReset" class="btn" data-i18n="pose.reset"></button>
    </section>
  </div>
</aside>
<!-- Decor in the room (decorate.js): the one picked, then two tabs: things to add (a catalogue
     with a picture of each), and what is in the room (with the layouts). -->
<aside id="decor" class="panel shop" data-i18n-aria-label="decor.title" hidden>
  <div class="panel-head">
    <strong class="shop-title" data-i18n="decor.title"></strong>
    <span class="grow"></span>
    <button id="closeDecor" class="link close" data-i18n-aria-label="decor.close">✕</button>
  </div>
  <section id="decorEdit" class="picked" hidden>
    <div class="picked-head">
      <span class="pic" id="decorPic"></span>
      <div class="grow"><h2 id="decorName"></h2><p class="small" data-i18n="decor.dragHint"></p></div>
      <button id="decorDone" class="link" data-i18n="decor.done"></button>
    </div>
    <div class="sliders">
      <label><span data-i18n="decor.turn"></span><input id="decorTurn" type="range" min="-180" max="180" step="5"><output id="decorTurnOut"></output></label>
      <label><span data-i18n="decor.lift"></span><input id="decorLift" type="range" min="0" max="300" step="1"><output id="decorLiftOut"></output></label>
    </div>
    <div class="chips swatches" id="decorColours" role="group" data-i18n-aria-label="decor.colour"></div>
    <div id="decorMix" class="mix" hidden>
      <label class="well"><input id="decorWheel" type="color" data-i18n-aria-label="decor.wheel"></label>
      <label class="hex"><span>HEX</span><input id="decorHex" spellcheck="false" autocomplete="off" maxlength="7"></label>
      <span class="rgb"><span>RGB</span><input id="decorR" type="number" min="0" max="255" step="1" aria-label="R"><input id="decorG" type="number" min="0" max="255" step="1" aria-label="G"><input id="decorB" type="number" min="0" max="255" step="1" aria-label="B"></span>
    </div>
    <label id="decorHeightRow" class="inline small"><span data-i18n="decor.height"></span><input id="decorHeight" type="number" inputmode="decimal" min="2" max="600" step="1"></label>
    <div class="repeat">
      <label class="small"><span data-i18n="decor.count"></span>
        <select id="decorRowN"><option>2</option><option>3</option><option>4</option><option selected>5</option><option>6</option><option>8</option><option>10</option><option>12</option></select></label>
      <button id="decorRow" class="btn" data-i18n="decor.row"></button>
      <button id="decorAround" class="btn" data-i18n="decor.around"></button>
      <button id="decorSet" class="btn" data-i18n="decor.set"></button>
    </div>
    <div class="quiet">
      <button id="decorRemove" class="link danger" data-i18n="decor.remove"></button>
      <button id="decorForget" class="link danger" data-i18n="decor.forget"></button>
    </div>
  </section>
  <div class="tabs" role="tablist">
    <button id="decorAddTab" role="tab" aria-selected="true" aria-controls="decorAdd" data-i18n="decor.tabAdd"></button>
    <button id="decorRoomTab" role="tab" aria-selected="false" aria-controls="decorRoom"></button>
  </div>
  <section id="decorAdd" role="tabpanel">
    <div class="chips shelves" id="decorGroups" role="group" data-i18n-aria-label="decor.groups"></div>
    <div class="cards" id="decorItems"></div>
    <label class="btn wide" for="decorPick" data-i18n="decor.add"></label>
    <input id="decorPick" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <form id="decorForm" class="form" hidden>
      <p class="small" data-i18n="decor.addHow"></p>
      <label><span data-i18n="decor.name"></span><input name="label" maxlength="40" autocomplete="off"></label>
      <label><span data-i18n="decor.height"></span><input name="height" type="number" inputmode="decimal" min="2" max="600" step="1" required></label>
      <div class="inline-chips"><button class="btn primary" data-i18n="decor.make"></button><button type="button" id="decorCancel" class="link" data-i18n="decor.cancel"></button></div>
      <p class="err" role="alert"></p>
    </form>
    <p id="decorStatus" class="small" role="status"></p>
  </section>
  <section id="decorRoom" role="tabpanel" hidden>
    <p id="decorEmpty" class="small" data-i18n="decor.empty"></p>
    <ul id="decorList" class="placed-list"></ul>
    <h2 data-i18n="decor.layout"></h2>
    <div class="inline-chips layouts">
      <select id="decorLayout" data-i18n-aria-label="decor.layout"></select>
      <button id="decorNew" class="link" data-i18n="decor.new"></button>
      <button id="decorCopy" class="link" data-i18n="decor.copy"></button>
      <button id="decorDelete" class="link danger" data-i18n="decor.delete"></button>
    </div>
  </section>
</aside>
<!-- by the picked thing, over the room: turn it, copy it, take it away -->
<div id="decorBar" class="objbar" role="toolbar" data-i18n-aria-label="decor.bar" hidden>
  <button id="barLeft" data-i18n-aria-label="decor.turnLeft"><svg viewBox="0 0 20 20"><path d="M7 4 3.5 7.5 7 11M4 7.5h7a5 5 0 1 1 0 10H8"/></svg></button>
  <button id="barRight" data-i18n-aria-label="decor.turnRight"><svg viewBox="0 0 20 20"><path d="M13 4l3.5 3.5L13 11M16 7.5H9a5 5 0 1 0 0 10h3"/></svg></button>
  <span class="sep"></span>
  <button id="barCopy" data-i18n-aria-label="decor.duplicate"><svg viewBox="0 0 20 20"><rect x="6.5" y="6.5" width="10" height="10" rx="2"/><path d="M13.5 4.5v-.5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 4v7A1.5 1.5 0 0 0 5 12.5h.5"/></svg></button>
  <button id="barRemove" data-i18n-aria-label="decor.remove"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4.5h4V6M6 6l.7 10h6.6L14 6"/></svg></button>
</div>
<!-- Every control on one card, as a game's controls screen: keys, what each does, in a word or two. -->
<dialog id="guide" class="guide" aria-labelledby="guideTitle">
  <div class="panel-head">
    <strong id="guideTitle" data-i18n="guide.title"></strong>
    <span class="grow"></span>
    <button id="closeGuide" class="link close" data-i18n-aria-label="guide.close">✕</button>
  </div>
  <section>
    <h2 data-i18n="guide.move"></h2>
    <dl class="keys">
      <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd data-i18n="guide.walk"></dd>
      <dt><kbd>Shift</kbd></dt><dd data-i18n="guide.run"></dd>
      <dt><kbd data-i18n="guide.space"></kbd></dt><dd data-i18n="guide.jump"></dd>
      <dt><kbd>R</kbd></dt><dd data-i18n="guide.back"></dd>
      <dt><kbd>F</kbd></dt><dd data-i18n="guide.rest"></dd>
      <dt><kbd>V</kbd></dt><dd data-i18n="guide.eye"></dd>
      <dt><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd></dt><dd data-i18n="guide.views"></dd>
    </dl>
  </section>
  <section>
    <h2 data-i18n="guide.limbs"></h2>
    <dl class="keys">
      <dt><kbd>Q</kbd><kbd>E</kbd></dt><dd data-i18n="guide.arms"></dd>
      <dt><kbd>Z</kbd><kbd>C</kbd></dt><dd data-i18n="guide.knees"></dd>
    </dl>
  </section>
  <section>
    <h2 data-i18n="guide.camera"></h2>
    <dl class="keys">
      <dt><span class="gesture" data-i18n="guide.drag"></span></dt><dd data-i18n="guide.orbit"></dd>
      <dt><span class="gesture" data-i18n="guide.scroll"></span></dt><dd data-i18n="guide.zoom"></dd>
    </dl>
  </section>
  <section>
    <h2 data-i18n="guide.panels"></h2>
    <dl class="keys">
      <dt><span class="gesture">Body Studio</span></dt><dd data-i18n="guide.menu"></dd>
      <dt><span class="gesture" data-i18n="room.btn"></span></dt><dd data-i18n="guide.room"></dd>
      <dt><span class="gesture" data-i18n="decor.btn"></span></dt><dd data-i18n="guide.decor"></dd>
    </dl>
    <p class="small" data-i18n="guide.note"></p>
  </section>
</dialog>
<!-- A room around the body (house.js): the rooms filmed so far, and one more. -->
<div id="roomMenu" class="menu" role="dialog" data-i18n-aria-label="room.title" hidden>
  <p class="small" id="roomNone" data-i18n="room.how"></p>
  <div class="chips" id="roomList"></div>
  <label id="roomSize" class="inline-range small" hidden><span data-i18n="room.size"></span>
    <input id="roomScale" type="range" min="0.8" max="1.25" step="0.01" value="1"><output id="roomScaleOut"></output></label>
  <p id="roomStatus" class="small" role="status"></p>
  <label class="link" for="roomPick" data-i18n="room.add"></label>
  <input id="roomPick" type="file" accept=".mov,.mp4,.m4v,.zip,video/*" hidden>
</div>
<div id="shopTip" class="tip" role="tooltip" hidden></div>
<div id="drop" class="drop" hidden><p class="big" data-i18n="drop.title"></p></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
import { Ground } from "/static/ground.js";
import { Busy } from "/static/busy.js";
import { Drawing } from "/static/draw.js";

const $ = (id) => document.getElementById(id);
const t = window.t;
window.i18n.apply();
fetch("/api/version").then((r) => r.json()).then((v) => ($("version").textContent = "v" + v.version)).catch(() => {});
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------------------------------------------------------------- scene
const canvas = $("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 1000);
const spark = new SparkRenderer({ renderer });
scene.add(spark);
const holder = new THREE.Group();            // orientation lives here; the splat stays untouched
scene.add(holder);
const ground = new Ground(scene);           // the body's shadow on the floor (ground.js)
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;                  // the body stays in the centre
controls.autoRotate = true;                  // a slow turntable until someone touches it
controls.autoRotateSpeed = 0.8;
controls.minPolarAngle = THREE.MathUtils.degToRad(20);
controls.maxPolarAngle = THREE.MathUtils.degToRad(115);
controls.addEventListener("start", () => (controls.autoRotate = false));

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  redraw();
  if (fit) frame();
});
// before and after each frame is drawn: f(true), f(false) (house.js keeps the camera inside a room)
const frameHooks = [];
// a frame is drawn only when something changed (draw.js): Spark has splats made or sorted to show,
// any input, a part asks (redraw(): a pose; keepDrawing: a walk through a room)
const drawing = new Drawing(), keepDrawing = [];
const redraw = (ms = 0) => drawing.redraw(performance.now(), ms);
spark.onDirty = () => redraw();
for (const type of ["pointerdown", "pointermove", "pointerup", "wheel", "keydown", "keyup"])
  addEventListener(type, () => redraw(300), { capture: true, passive: true });
renderer.setAnimationLoop((now) => {
  if (!drawing.due(now, controls.update(), keepDrawing.some((f) => f()))) return;
  for (const f of frameHooks) f(true);
  renderer.render(scene, camera);
  for (const f of frameHooks) f(false);
});

// Brush writes the scene's up direction into the PLY header (numbers or a letter).
function upAxisFromPly(bytes) {
  const head = new TextDecoder("latin1").decode(bytes.subarray(0, Math.min(bytes.length, 65536)));
  const end = head.indexOf("end_header");
  const m = end > 0 && head.slice(0, end).match(/comment\s+Vertical axis:\s*([^\n\r]+)/);
  if (!m) return null;
  const n = m[1].match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/g);
  const v = n && n.length === 3 ? new THREE.Vector3(+n[0], +n[1], +n[2])
    : { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) }[m[1].trim().toLowerCase()];
  return v && v.lengthSq() > 1e-8 ? v.normalize() : null;
}

// The body's extent from its opaque splats (5th-95th percentile), in world space.
function measure(mesh) {
  holder.updateMatrixWorld(true);
  const m = holder.matrixWorld, n = mesh.numSplats || 0, stride = Math.max(1, Math.floor(n / 150000));
  const xs = [], ys = [], zs = [], p = new THREE.Vector3();
  mesh.forEachSplat((i, c, _s, _q, opacity) => {
    if (i % stride || opacity < 0.3) return;
    p.copy(c).applyMatrix4(m); xs.push(p.x); ys.push(p.y); zs.push(p.z);
  });
  if (xs.length < 10) {
    const b = mesh.getBoundingBox(true).applyMatrix4(m);
    return { center: b.getCenter(new THREE.Vector3()), size: b.getSize(new THREE.Vector3()) };
  }
  const pct = (a, q) => { a.sort((x, y) => x - y); return a[Math.floor(q * (a.length - 1))]; };
  const lo = new THREE.Vector3(pct(xs, .005), pct(ys, .005), pct(zs, .005));   // keep hands and feet
  const hi = new THREE.Vector3(pct(xs, .995), pct(ys, .995), pct(zs, .995));
  return { center: lo.clone().add(hi).multiplyScalar(.5), size: hi.clone().sub(lo) };
}

// Whole body in view, head to feet, centred between the top bar and the shelf. The width
// allowed for is the body's diagonal, so outstretched arms stay in frame while it turns.
// With the progress panel open, the body stays centred in the space the panel leaves.
const CHROME = 84;                                // px kept clear at the top and at the bottom
function covered() {                              // px the panels take at each side, or at the bottom
  // and the top bar beyond one row (on a phone its buttons wrap to a second row)
  const out = { left: 0, right: 0, bottom: 0, top: Math.max(0, document.querySelector(".bar").getBoundingClientRect().bottom - 64) };
  for (const id of ["progress", "studio", "decor"]) {
    const el = $(id);
    if (el.hidden) continue;
    const r = el.getBoundingClientRect();
    if (innerWidth <= 600) out.bottom = Math.max(out.bottom, innerHeight - r.top);
    else if (r.left < innerWidth / 2) out.left = r.right;
    else out.right = innerWidth - r.left;
  }
  return out;
}
function frame() {
  const { center, size } = fit;
  const cover = covered();
  const w = innerWidth - cover.right - cover.left, h = innerHeight - cover.bottom - cover.top;
  if (cover.right || cover.left || cover.bottom || cover.top)
    camera.setViewOffset(innerWidth, innerHeight, (cover.right - cover.left) / 2, (cover.bottom - cover.top) / 2, innerWidth, innerHeight);
  else camera.clearViewOffset();
  // in a room (house.js): from where the camera sees the room round the body
  if (window.bodyApp.house?.shown() && window.bodyApp.house.view()) return;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const free = Math.max(0.3, (h - 2 * CHROME) / innerHeight);   // share of the height the body may use
  const width = Math.hypot(size.x, size.z);
  let dist = 1.08 * Math.max(size.y / 2 / (tanV * free), width / 2 / (tanV * (w / innerHeight) * 0.92)) + width / 2;
  // with the shop around the body (wardrobe.js), far enough back to see most of it too
  const room = window.bodyApp.room?.() || 0;
  if (room) dist = Math.max(dist, room / 2 / (tanV * (w / innerHeight)));
  camera.near = dist / 100; camera.far = dist * 20; camera.updateProjectionMatrix();
  camera.position.set(center.x, center.y + size.y * 0.05, center.z + dist);
  controls.target.copy(center);
  controls.minDistance = dist * 0.35; controls.maxDistance = dist * 2.5;
  controls.update();
}

let mesh = null, fit = null, current = null, meshFile = null;

// One loading screen, the logo turning, until the body can really be used (busy.js): from the page
// opening, the body loading here, then its skeleton and its pose and tattoos (tattoo.js), the
// clothes fitted and what was worn put back on, the shop around it (wardrobe.js), a room
// (house.js), each a step through bodyApp.busy. A step starts before the one it follows ends,
// so the screen stays up across them; it fades out when the last one is done.
const busy = new Busy(({ shown, waiting, text, slow }) => {
  $("busyText").textContent = text;
  $("busySlow").textContent = slow;
  $("busy").hidden = !shown;
  $("busy").classList.toggle("leaving", shown && !waiting);
  document.body.classList.toggle("is-busy", waiting);
});
busy.set("start", t("load.starting"), { now: true });         // (shown from the first paint)

async function show(body) {
  if (current === body.file) return;
  current = body.file;
  store.set("body:last", body.file);
  for (const b of document.querySelectorAll(".shelf button")) b.classList.toggle("on", b.dataset.file === body.file);
  $("empty").hidden = true; $("loading").hidden = true;
  busy.set("body", t("load.loading", { name: body.name.replace(/_/g, " ") }), { slow: t("load.slowBody") });
  const res = await fetch("/files/" + body.file.split("/").map(encodeURIComponent).join("/"));
  if (!res.ok) { busy.set("body", null); $("loading").hidden = false; $("loadingText").textContent = t("load.failed", { name: body.name }); return; }
  const bytes = new Uint8Array(await res.arrayBuffer());
  if (current !== body.file) return;           // another body was picked meanwhile
  if (mesh) { holder.remove(mesh); mesh.dispose?.(); }
  const up = upAxisFromPly(bytes);
  holder.quaternion.copy(up ? new THREE.Quaternion().setFromUnitVectors(up, new THREE.Vector3(0, 1, 0))
                            : new THREE.Quaternion(1, 0, 0, 0));   // COLMAP data is usually y-down
  mesh = new SplatMesh({ fileBytes: bytes, fileName: body.file });
  meshFile = body.file;
  holder.add(mesh);
  await mesh.initialized;
  fit = measure(mesh);
  ground.place(fit.center, fit.center.y - fit.size.y / 2, fit.size.y, fit.size.x, fit.size.z);
  frame();
  controls.autoRotate = true;
  window.bodyViewer = { numSplats: () => mesh.numSplats || 0, size: () => fit.size.toArray(), file: () => current };
  $("studioBtn").hidden = false;
  dispatchEvent(new Event("bodyshown"));       // (what follows starts its steps meanwhile)
  busy.set("body", null);
}

// ---------------------------------------------------------------- library and runs
let shown = "", bodyList = [];
async function refreshBodies() {
  const bodies = bodyList = await (await fetch("/api/bodies")).json();
  const key = bodies.map((b) => b.file).join("|");
  if (key !== shown) {
    shown = key;
    $("shelf").replaceChildren(...bodies.map((b) => {
      const el = document.createElement("button");
      el.textContent = b.name.replace(/_/g, " ");
      el.dataset.file = b.file;
      el.classList.toggle("on", b.file === current);
      el.onclick = () => show(b);
      return el;
    }));
  }
  $("empty").hidden = bodies.length > 0 || !!mesh;
  if (!mesh && bodies.length) show(bodies.find((b) => b.file === store.get("body:last")) || bodies[0]);
  busy.set("start", null);
  return bodies;
}

let watching = null, lastPill = null;
function pill(cls, text) {
  const el = $("job");
  el.hidden = false; el.className = "pill" + (cls ? " " + cls : ""); el.textContent = text;
}
async function refreshJobs() {
  const jobs = await (await fetch("/api/jobs")).json();
  const live = jobs.find((j) => j.status === "running" || j.status === "queued");
  const last = jobs[0];
  if (live) {
    watching = live.id;
    lastPill = () => {
      const name = live.name.replace(/_/g, " ");
      if (live.status === "queued") return pill("busy", t("job.waiting", { name }));
      const left = live.left ? t("job.left", { left: live.left }) : t("job.measuring");
      pill("busy", `${t("job.stage" + (live.stage || 1), { name })} · ${left}`);
    };
    lastPill();
  } else if (last && last.id === watching) {
    watching = null;
    const name = last.name.replace(/_/g, " ");
    lastPill = () => last.status === "done" ? pill("", t("job.ready", { name }))
      : pill("bad", t("job.failed", { name, error: last.advice[0] || last.error || last.status }));
    lastPill();
    if (last.kind === "room") { dispatchEvent(new Event("roomsready")); return; }   // (house.js)
    const bodies = await refreshBodies();
    const made = bodies.find((b) => b.file === last.body);
    if (made) show(made);
  }
}

async function upload(file, kind = "body") {
  lastPill = null;
  pill("busy", t("job.uploading", { name: file.name }));
  const r = await fetch("/api/upload?name=" + encodeURIComponent(file.name) + (kind === "room" ? "&kind=room" : ""),
                        { method: "POST", body: file });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    return pill("bad", t(e.code ? "err." + e.code : "err.upload"));
  }
  refreshJobs();
}

// the Guide: every control on one card (Esc, ✕ or a click outside it closes it)
$("guideBtn").onclick = () => $("guide").showModal();
$("closeGuide").onclick = () => $("guide").close();
$("guide").addEventListener("click", (e) => { if (e.target === $("guide")) $("guide").close(); });

$("pick").onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
let depth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); depth++; $("drop").hidden = false; });
addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; $("drop").hidden = true; } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => {
  e.preventDefault(); depth = 0; $("drop").hidden = true;
  const f = e.dataTransfer.files[0];
  if (f) upload(f);
});
addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
  if (e.key === "?" && !$("guide").open) { $("guide").showModal(); return; }
  if (e.key === "r" || e.key === "R") { if (fit) frame(); }      // (Space jumps: tattoo.js)
});

// for the progress panel (progress.js)
window.bodyApp = {
  bodies: () => bodyList,
  current: () => bodyList.find((b) => b.file === current) || null,
  show: (id) => { const b = bodyList.find((x) => x.id === id); if (b) show(b); },
  reframe: () => { if (fit) frame(); },
  redraw,                                    // (something changed in the scene: draw a frame)
  busy: (key, text, opts) => busy.set(key, text, opts),   // (tattoo.js: the skeleton, getting ready to move)
  upload,                                    // (house.js: a room's video)
  // for the tattoo and pose panel (tattoo.js)
  viewer: { scene, spark, holder, ground, camera, controls, renderer, canvas, frameHooks, keepDrawing, redraw, mesh: () => mesh, file: () => current,
            loaded: () => !!mesh && meshFile === current },   // (the body picked may still be on its way)
};
refreshBodies(); refreshJobs();
setInterval(refreshJobs, 2000);
</script>
