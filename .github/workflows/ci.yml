name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20             # a hung apt/brew install shouldn't hold CI for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  python: "3.9" }    # (3.9 isn't built for ubuntu-latest, 26.04)
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest,  python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; fi
      - run: pip install .          # also installs the pinned splat-studio and OpenCV
      - run: python -m unittest discover -s tests/unit -t . -v
      - name: End to end (real splat-studio pipeline, its stand-in COLMAP and Brush)
        run: |
          export SPLAT_STUDIO_SRC="$(python3 scripts/splat_studio_src.py .splat-studio-src)"
          python -m unittest tests.integration.test_end_to_end -v

  browser:
    name: app in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . playwright && python -m playwright install --with-deps chromium
      - run: python -m unittest tests.browser.test_viewer -v
