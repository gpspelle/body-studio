name: CI

# Docs alone (README, CHANGELOG, notes, screenshots) run nothing here: Docs checks them.
# (CREDITS.md isn't skipped: test_wardrobe reads it.)
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "CHANGELOG.md", "AGENTS.md", "CLAUDE.md", "docs/**"]
  pull_request:
    paths-ignore: ["README.md", "CHANGELOG.md", "AGENTS.md", "CLAUDE.md", "docs/**"]

# a new push to a PR stops the run for the one before it (on main, every commit is tested)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The browser tests take the longest by far; skip them when nothing the page uses changed
  # (only unit or JS tests, scripts, credits ...).
  changes:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "browser=$(python3 scripts/browser_needed.py "$BASE")" >> "$GITHUB_OUTPUT"

  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20             # a hung apt/brew install shouldn't hold CI for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  python: "3.9" }    # (3.9 isn't built for ubuntu-latest, 26.04)
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest,  python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Linux: a static ffmpeg and ffprobe, cached (apt's mirror has taken 20 minutes for its 60 packages)
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pip install .          # also installs the pinned splat-studio and OpenCV
      - run: python scripts/test.py            # each test class in its own process, side by side
      - name: End to end (real splat-studio pipeline, its stand-in COLMAP and Brush)
        run: |
          export SPLAT_STUDIO_SRC="$(python3 scripts/splat_studio_src.py .splat-studio-src)"
          python -m unittest tests.integration.test_end_to_end -v

  browser:
    name: app in a real browser (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25             # pages rendered in software (no GPU): a few minutes each
    strategy:
      fail-fast: false
      # the tests split by how long they take on CI, so the shards end about together
      # (tests/unit/test_ci.py checks that every browser test is in one)
      matrix:
        include:
          - shard: clothes
            tests: test_clothes_go_on_and_come_off
          - shard: rooms
            tests: test_decorates_a_room test_the_menu_shows_each_mode_its_tools test_a_tattoo_in_the_tattoo_studio
          - shard: body
            tests: >-
              test_body_loads_upright_without_errors test_progress_panel_follows_a_person
              test_stands_walks_and_sits_in_a_room test_switches_the_body_model
              test_tattoo_follows_the_body_as_it_moves test_walks_and_jumps_with_the_keyboard
    env:
      BODY_STUDIO_CHROMIUM: /usr/bin/google-chrome   # the runner's own Chrome: nothing to download or install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install . playwright
      - name: Sample rooms (drawn once per change to the app's Python, tests/fakes/samples.py)
        uses: actions/cache@v4
        with:
          path: ~/.cache/body-studio-tests
          key: samples-${{ hashFiles('src/body_studio/*.py') }}
      - name: Browser tests (${{ matrix.shard }})
        run: python -m unittest -v $(for t in ${{ matrix.tests }}; do echo tests.browser.test_viewer.Viewer.$t; done)
